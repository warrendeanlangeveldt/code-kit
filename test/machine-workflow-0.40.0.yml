# code-kit 0.40.0: this repository's cloud machine, on Sprites, in your own account.
#
# It makes the machine, starts and stops the lead's session on it, and removes it, with nobody at a
# computer. You start it from the Actions tab, or a hub you've connected starts it for you. It reads
# one secret, SPRITES_TOKEN, which only this repository's workflows can read. The sign-ins to GitHub
# and to Claude are never in a workflow: the machine's owner types them at the machine's own terminal.
#
# Printed by `code-kit cloud workflow`. A file changed by hand is no longer code-kit's.
name: code-kit machine
run-name: code-kit machine ${{ inputs.act }} ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      act:
        description: 'up makes the machine ready; start and stop open and end its session; down removes it'
        required: true
        type: choice
        options: [up, start, stop, down]
      request:
        description: "Who asked, as their own id for it. It's shown in the run's name."
        required: false
        type: string
        default: ''
      discard:
        description: "With down: remove the machine with the work on it that isn't on GitHub"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: code-kit-machine
  cancel-in-progress: false

env:
  CODE_KIT: npx --yes @warren-dean/code-kit@0.40.0

jobs:
  machine:
    name: ${{ inputs.act }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the sprite command
        run: |
          curl -fsSL https://sprites.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sign in to Sprites
        env:
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
        run: |
          if test -z "$SPRITES_TOKEN"; then
            echo "::error::This repository has no SPRITES_TOKEN secret. Make a token for your Fly organisation and add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          sprite auth setup --token "$SPRITES_TOKEN"
          sprite list > /dev/null
      - name: Make the machine
        if: inputs.act == 'up'
        run: $CODE_KIT cloud up --unattended --platform sprites --stage machine
      - name: Copy the repository there
        if: inputs.act == 'up'
        run: $CODE_KIT cloud up --unattended --platform sprites --stage clone
      - name: Install code-kit and the terminal there
        if: inputs.act == 'up'
        run: $CODE_KIT cloud up --unattended --platform sprites
      - name: Start the lead's session
        if: inputs.act == 'start'
        run: $CODE_KIT cloud open --unattended --platform sprites
      - name: Stop the lead's session
        if: inputs.act == 'stop'
        run: $CODE_KIT cloud stop --unattended --platform sprites
      - name: Remove the machine
        if: inputs.act == 'down'
        env:
          DISCARD: ${{ inputs.discard && '--discard' || '' }}
        run: $CODE_KIT cloud down --unattended --platform sprites $DISCARD
