# code-kit verify: the project's rules for every pull request, including work done outside Claude Code.
# It checks the rules only (--no-checks): the merge queue ran the project's checks before each merge, and
# the project's full CI runs on its release branches (docs/specs/25-what-ci-costs.md, CIC-1).
name: code-kit

on:
  pull_request:

concurrency:
  group: code-kit-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify compares the branch with where it left the base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # {{init replaces this line with the steps that install the project's dependencies, e.g.
      #   pnpm/action-setup and `pnpm install --frozen-lockfile`: a fix story's test is run without its fix (REG-1)}}
      - name: Verify
        run: >
          npx --yes @warren-dean/code-kit@{{code-kit version}} verify --no-checks
          --base origin/${{ github.base_ref }}
          --branch ${{ github.head_ref }}
